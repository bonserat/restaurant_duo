# Tự build bản web và đưa lên GitHub Pages mỗi khi push code.
# Link chơi: https://<tên-github>.github.io/<tên-repo>/
name: Web (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Thêm nền tảng web (nếu repo chưa có thư mục web)
        run: '[ -f web/index.html ] || flutter create . --platforms web'

      - name: Tên + biểu tượng riêng của game
        run: python3 tools/web_brand.py web

      - name: Màn hình chờ lúc tải game
        run: python3 tools/web_splash.py web/index.html

      - run: flutter pub get

      - name: Build web
        run: |
          set -o pipefail
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee build.log || {
            # đưa lỗi biên dịch lên thành chú thích để xem nhanh ở trang Actions
            grep -E "Error|error:|\.dart:[0-9]+" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
