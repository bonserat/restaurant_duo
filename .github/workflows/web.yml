# Tự build bản web và đưa lên GitHub Pages mỗi khi push code.
# Link chơi: https://<tên-github>.github.io/<tên-repo>/
name: Web (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Thêm nền tảng web (nếu repo chưa có thư mục web)
        run: '[ -f web/index.html ] || flutter create . --platforms web'

      - name: Đặt tên trang
        run: |
          sed -i 's#<title>.*</title>#<title>Nhà Hàng Đôi</title>#' web/index.html
          sed -i 's#content="[^"]*" name="apple-mobile-web-app-title"#content="Nhà Hàng Đôi" name="apple-mobile-web-app-title"#; s#name="apple-mobile-web-app-title" content="[^"]*"#name="apple-mobile-web-app-title" content="Nhà Hàng Đôi"#' web/index.html

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
